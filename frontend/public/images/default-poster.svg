<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17" />
      <stop offset="50%" stop-color="#121727" />
      <stop offset="100%" stop-color="#080a11" />
    </linearGradient>

    <!-- Subtle Red Glow -->
    <radialGradient id="redGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#e50914" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#e50914" stop-opacity="0" />
    </radialGradient>

    <!-- Card Inner Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#e50914" stop-opacity="0.25" />
    </linearGradient>

    <!-- Clapperboard Accent -->
    <linearGradient id="clapperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Film Strip Pattern -->
    <pattern id="filmHoles" x="0" y="0" width="20" height="30" patternUnits="userSpaceOnUse">
      <rect x="4" y="6" width="12" height="18" rx="3" fill="#ffffff" fill-opacity="0.04" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="600" fill="url(#bgGrad)" />

  <!-- Radial Glow -->
  <rect width="400" height="600" fill="url(#redGlow)" />

  <!-- Film Strip Side Tracks -->
  <rect x="0" y="0" width="20" height="600" fill="url(#filmHoles)" />
  <rect x="380" y="0" width="20" height="600" fill="url(#filmHoles)" />

  <!-- Inner Frame -->
  <rect x="28" y="28" width="344" height="544" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Central Icon Container (Glass Card) -->
  <g transform="translate(200, 240)">
    <!-- Outer Glow Circle -->
    <circle r="72" fill="#e50914" fill-opacity="0.08" filter="url(#softGlow)" />
    
    <!-- Glass Circle -->
    <circle r="60" fill="#1e2438" fill-opacity="0.65" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" />

    <!-- Cinema Clapperboard / Film Graphic -->
    <g transform="translate(-32, -32) scale(0.64)">
      <!-- Clapper Top Sticks -->
      <path d="M 6 22 L 94 4 L 94 20 L 6 38 Z" fill="url(#clapperGrad)" />
      <!-- Stripes on top stick -->
      <path d="M 22 19 L 34 16 L 24 35 L 12 37 Z" fill="#ffffff" fill-opacity="0.85" />
      <path d="M 46 14 L 58 12 L 48 30 L 36 32 Z" fill="#ffffff" fill-opacity="0.85" />
      <path d="M 70 10 L 82 7 L 72 25 L 60 27 Z" fill="#ffffff" fill-opacity="0.85" />

      <!-- Clapper Base Body -->
      <rect x="6" y="38" width="88" height="56" rx="6" fill="#131722" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" />

      <!-- Play triangle inside clapper base -->
      <polygon points="44,52 64,66 44,80" fill="#e50914" />
      <circle cx="52" cy="66" r="2" fill="#ffffff" />
    </g>
  </g>

  <!-- Typography Area -->
  <g transform="translate(200, 360)" text-anchor="middle">
    <!-- Brand Title -->
    <text y="0" font-family="'Oswald', 'Montserrat', -apple-system, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#f8fafc">
      MOVIES <tspan fill="#e50914">CENTER</tspan>
    </text>

    <!-- Subtitle / Notice -->
    <text y="26" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="2" fill="#64748b" text-transform="uppercase">
      POSTER UNAVAILABLE
    </text>

    <!-- Decorative Divider Line -->
    <line x1="-36" y1="46" x2="36" y2="46" stroke="#e50914" stroke-opacity="0.4" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Bottom Brand Watermark -->
  <g transform="translate(200, 535)" text-anchor="middle">
    <circle cx="-50" cy="-3" r="3" fill="#e50914" fill-opacity="0.6" />
    <text font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="500" letter-spacing="1.5" fill="#475569">
      CINEMATIC STREAMING
    </text>
    <circle cx="50" cy="-3" r="3" fill="#e50914" fill-opacity="0.6" />
  </g>
</svg>
