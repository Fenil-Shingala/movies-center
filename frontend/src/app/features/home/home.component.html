<div class="home-view">
  @if (isLoading()) {
    <!-- Hero Skeleton Loader -->
    <div class="hero-skeleton skeleton">
      <div class="hero-skeleton-content container">
        <div class="badge-skel skeleton"></div>
        <div class="title-skel skeleton"></div>
        <div class="meta-skel skeleton"></div>
        <div class="text-skel skeleton"></div>
        <div class="text-skel skeleton short"></div>
        <div class="actions-skel">
          <div class="btn-skel skeleton"></div>
          <div class="btn-skel skeleton"></div>
        </div>
      </div>
    </div>

    <!-- Rows Skeleton Loader -->
    <div class="container content-container">
      @for (rowNum of [1, 2]; track rowNum) {
        <div class="row-skeleton">
          <div class="row-title-skel skeleton"></div>
          <div class="cards-skel">
            @for (cardNum of [1, 2, 3, 4, 5, 6]; track cardNum) {
              <div class="card-skel skeleton"></div>
            }
          </div>
        </div>
      }
    </div>
  } @else if (errorMessage()) {
    <!-- Error State -->
    <div class="container error-container">
      <div class="error-card">
        <h2 class="error-title">Content Unavailable</h2>
        <p class="error-message">{{ errorMessage() }}</p>
        <button type="button" class="btn btn-primary" (click)="loadHomeFeed()">
          Retry Loading
        </button>
      </div>
    </div>
  } @else if (feed(); as currentFeed) {
    <!-- Live Content Feed -->
    <app-hero-banner [hero]="currentFeed.hero" />

    <div class="container content-container">
      @for (row of currentFeed.rows; track row.id) {
        <app-content-row [row]="row" />
      }
    </div>
  }
</div>
